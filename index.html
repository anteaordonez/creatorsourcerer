:root{
  /* tamagotchi screen palette */
  --page:#fbf3d5;          /* cream backdrop */
  --screen:#fffbea;        /* panel fill */
  --screen-2:#fff5d6;      /* soft panel fill */
  --ink:#3d2b63;           /* pixel borders + headings */
  --text:#2e2348;          /* body text (AA on cream) */
  --muted:#5a4d78;
  --faint:#6e628c;

  --lav:#b9a4ea;  --lav-soft:#eee6fd;  --lav-ink:#4f3796;
  --mint:#97dcbf; --mint-soft:#e0f6ec; --mint-ink:#1d6a4a;
  --pink:#f4a6c0; --pink-soft:#fde4ed; --pink-ink:#99294f;
  --gold:#f3c94f; --gold-soft:#fff0bd; --gold-ink:#6f4d00;
  --dots:#f0a3bd;          /* dotted divider like the device screen */

  /* type */
  --font-pixel:"Silkscreen","Pixelify Sans","Press Start 2P",ui-monospace,Menlo,monospace;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-body:16px; --fs-small:14px;
  --fs-label:15px;         /* pixel eyebrow labels (was ~10px) */
  --fs-h2:36px; --fs-h1:56px;

  /* pixel geometry */
  --px:4px;                /* one "pixel" of border */
  --speed:.18s;
}
html{background:var(--page)}
body{
  background:
    radial-gradient(var(--lav-soft) 1.2px,transparent 1.4px) 0 0/16px 16px,
    var(--page);
}
/* pixel border: notched corners, like a retro LCD box */
.px{
  background:var(--screen);
  box-shadow:
    calc(var(--px)*-1) 0 0 0 var(--ink), var(--px) 0 0 0 var(--ink),
    0 calc(var(--px)*-1) 0 0 var(--ink), 0 var(--px) 0 0 var(--ink),
    inset calc(var(--px)*-1) calc(var(--px)*-1) 0 0 rgba(61,43,99,.08);
  margin:var(--px);
}
.px.soft{background:var(--screen-2)}
.px.lav{background:var(--lav-soft)} .px.mint{background:var(--mint-soft)} .px.pink{background:var(--pink-soft)} .px.gold{background:var(--gold-soft)}
.dots{border:0;height:4px;background:repeating-linear-gradient(90deg,var(--dots) 0 4px,transparent 4px 10px);margin:0}
.sprite{image-rendering:pixelated;shape-rendering:crispEdges;display:inline-block;vertical-align:middle}

.drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--screen);box-shadow:-6px 0 0 0 var(--ink);transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column;z-index:10}
.drawer.open{transform:none}
.dhead{padding:18px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--lav-soft);border-bottom:4px solid var(--ink)}
.dhead .photo{width:84px;height:84px;font-size:26px}
.dhead h3{font-family:var(--font-pixel);font-weight:400;font-size:28px;margin:0;color:var(--ink);line-height:1.1}
.dnav{display:flex;gap:4px;align-self:start}
.dnav .btn{padding:4px 12px;min-width:46px;min-height:42px;font-family:var(--font-body,system-ui),system-ui,sans-serif;font-size:24px;font-weight:700;line-height:1}
.dbody{overflow-y:auto;padding:18px 24px 40px}
.dsec{margin:0 0 20px}
.dsec h4{font-family:var(--font-pixel);font-weight:400;font-size:15px;color:var(--lav-ink);text-transform:uppercase;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.dsec p{margin:0 0 6px}
.dsec ul{margin:0;padding-left:18px}
.dsec li{margin:0 0 4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-weight:700;color:var(--muted)}
.kv dd{margin:0}
.sugg{font-family:var(--font-pixel);font-size:11.5px;background:var(--gold);color:var(--ink);padding:2px 6px}
.chanlist{list-style:none;padding:0!important}
.chanlist li{display:flex;gap:10px;align-items:baseline}
.chanlist a{font-weight:700;min-width:96px}
.chanlist span{color:var(--muted);font-size:14px}

@media (max-width:1020px){
  .rec,.spell{grid-template-columns:1fr}
  .grid,.grid.many{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .brand h1{white-space:normal}
  .hstat div{min-width:0;flex:1}
  .ctop>div{min-width:0}
  .chrows{grid-template-columns:minmax(0,1fr)}
  .chans a{white-space:normal}
  .picks3,.picksR{grid-template-columns:1fr}
  .method{grid-template-columns:1fr}
  .tally{text-align:left;white-space:normal}
  .cav ul{columns:1}
}
@media (max-width:560px){
  :root{--fs-h1:36px;--fs-h2:22px}
  .wrap{padding:16px 14px 40px}
  .trait{grid-template-columns:1fr;gap:4px}
  .ctop{grid-template-columns:92px minmax(0,1fr)}
  .photo{width:76px;height:76px}
  .kv{grid-template-columns:1fr}
  .status .mid{display:none}
  .deco{display:none}
  .hero{padding:20px 16px}
  .brand{gap:12px}
  .brand>svg{width:44px;height:auto}
  .hstat span{font-size:11px}
  .hdeco{display:none}
  .brand p{font-size:16px}
  .why div{grid-template-columns:1fr;gap:0}
}
/* phones: buttons get their own row on top, profile details below with full width */
@media (max-width:560px){
  .dhead{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"nav nav" "photo info";gap:12px 14px;padding:10px 14px 14px;position:static;align-items:start}
  .dhead>.dnav{grid-area:nav;position:static;display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:3px dashed var(--lav)}
  .dhead>.dnav .btn{flex:1;min-height:52px;font-size:32px;padding:4px 8px;margin:3px}
  .dhead>:first-child{grid-area:photo}
  .dhead>div:not(.dnav){grid-area:info;min-width:0}
  .dhead .photo{width:72px;height:72px;font-size:22px}
  .dhead h3{font-size:24px}
  .dhead .rank{display:flex;flex-wrap:wrap;gap:6px;padding:0;min-height:0}
  .dhead .rank span{white-space:nowrap}
  .dhead .meta{font-size:14.5px;line-height:1.35}
  .dchans{gap:4px 16px;font-size:15.5px;margin-top:6px}
  .dbody{padding:16px 16px 40px}
}
</style>
</head>

<div class="wrap">

  <nav class="topnav" id="topnav" aria-label="Sections"><ul>

</div>

      <div><div class="forline">${sprite('heart',12,{a:C.pink,b:C.pink})} ${esc(D.meta.runDate)}</div><h1>${esc(D.meta.title)}</h1><p>${esc(D.meta.tagline)}</p></div>

    <div class="hdeco" aria-hidden="true"><span class="twinkle">${sprite('sparkle',18,{a:C.lav,b:C.pink})}</span>${sprite('moon',16,{a:C.mint})}<span class="twinkle" style="animation-delay:1s">${sprite('sparkle',13,{a:C.pink,b:C.gold})}</span></div>
    <div class="hstat"><div class="px lav"><b>${considered}</b><span>considered</span></div><div class="px lav"><b>${passedScreen}</b><span>passed</span></div><div class="px mint"><b>${onBoard}</b><span>on the board</span></div></div>
  </div>`;

/* ---- recommendation ---- */
const R = D.recommendation;
const candBy = n => D.candidates.find(c=>c.name===n);
$('#recSec').innerHTML = `
  <div class="px rec" style="grid-template-columns:1fr">
    <div>
      <h2 class="title" id="recT" style="display:flex;align-items:center;gap:12px">${sprite('ball',34,{a:C.ink,b:C.lav,c:'#ffffff',d:C.pink})} Sorcerer's recommendation</h2>
      <p class="reclead">${esc(R.intro||'')}</p>
      ${(()=>{ const l=[...D.candidates].sort((a,b)=>a.order-b.order); const tile=c=>`<div class="px ptile ${c.match==='clean'?'':'soft'}" data-name="${esc(c.name)}" tabindex="0">${photo(c,'photo')}<div><div class="rank"><span class="rk">#${c.order}</span><span class="rl ${c.match==='conditional'?'cond':''}">${esc(c.rankLabel)}</span></div><h4>${esc(c.name)}</h4><p>${esc(c.rankLine)}</p></div></div>`;
        return `<div class="picks3">${l.slice(0,3).map(tile).join('')}</div>${l.length>3?`<div class="picksR">${l.slice(3).map(tile).join('')}</div>`:''}`; })()}
    </div>
  </div>`;

/* ---- spell / profile ---- */
const P = D.profile;
const tagGroups = (t, gold) => [['talks','Talks about'],['audience','Audience'],['bestfor','Best for']].map(([k,l])=>`
  <div class="group"><div class="gl">${l}</div><div class="chips">${(t[k]||[]).map(x=>`<span class="chip ${gold(k,x)?'gold':''}">${esc(x)}</span>`).join('')}</div></div>`).join('');
$('#spellSec').innerHTML = `
  <h2 class="title" id="spellT">The spell: profile similar to ${esc(P.seed)}</h2>
  <div class="spell">
    <div class="px main">
      <h3 class="cphead">${sprite('sparkle',18,{a:C.lav,b:C.pink})} Creator profile</h3>
      ${P.traits.map(t=>`<div class="trait"><div class="k">${esc(t.key)}</div><div class="v">${esc(t.value)}</div></div>`).join('')}
    </div>
    <div class="aside">
      <div class="px panel">
        <div class="px lav spellhead"><div class="seedfig">${photo({name:P.seed,photo:P.seedPhoto},'photo')}<span class="namebadge">${esc(P.seed)}</span></div><div><h3>What ${esc(P.seed.split(' ')[0])} covers</h3><p>${esc(P.seedLine||'')}</p></div></div>
        ${tagGroups(ALEX,()=>true)}
      </div>
    </div>
  </div>`;

/* ---- shortlist ---- */
let sortKey='rec';
const GR={verified:0,partial:1,unverified:2};
function sorted(){
  const a=[...D.candidates];
  if(sortKey==='aud') a.sort((x,y)=>totalOf(y)-totalOf(x));
  else if(sortKey==='growth') a.sort((x,y)=>(GR[x.growth.status]??3)-(GR[y.growth.status]??3)||x.order-y.order);
  else a.sort((x,y)=>x.order-y.order);
  return a;
}
function considerBox(c){ return (c.consider||[]).length ? `<div class="px lav consider"><div class="label" style="font-size:13px;margin-bottom:6px">${sprite('star',14,{a:C.ink})} Things to consider</div><ul>${c.consider.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>` : ''; }
const kfmt = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M' : n>=1000 ? Math.round(n/1000)+'K' : String(n);
const totalOf = c => c.channels.filter(ch=>!ch.shared && typeof ch.count==='number').reduce((a,ch)=>a+ch.count,0);
const breakdown = c => c.channels.filter(ch=>!ch.shared && typeof ch.count==='number').map(ch=>`${ch.label} ${kfmt(ch.count)}`).join(' · ');
function chanPanel(c){
  const cnt = ch => typeof ch.count==='number' ? `<span class="dots"></span><span class="cnt">${kfmt(ch.count)}${ch.plus?'+':''}${ch.shared?`<span class="shn">${esc(ch.shared)}, not in total</span>`:''}</span>` : '';
  return `<div class="px soft chpanel"><div class="ttl"><b>≈ ${kfmt(totalOf(c))}</b><span>total followers</span></div>
    <div class="chrows">${c.channels.map(ch=>`<div class="chrow"><a class="chan" href="${esc(ch.url)}" target="_blank" rel="noopener" title="Open ${esc(ch.label)} in a new tab">${esc(ch.label)}<span class="ext" aria-hidden="true">↗</span></a>${cnt(ch)}</div>`).join('')}</div></div>`;
}
function chanLinks(c){ return c.channels.map(ch=>`<a class="chan" href="${esc(ch.url)}" target="_blank" rel="noopener noreferrer">${esc(ch.label)}${typeof ch.count==='number'?`<span class="n">${kfmt(ch.count)}${ch.plus?'+':''}</span>`:''}${ch.shared?`<span class="sh"> (${esc(ch.shared)})</span>`:''}</a>`).join(''); }
const growthChip = g => g.status==='unverified' ? '' : '<span class="pill ok">Growing</span>';
function card(c){
  const sh=sharedOf(c), p=pickOf(c.name), allShared=[].concat(sh.s.talks,sh.s.audience,sh.s.bestfor);
  const lbl = p ? p.label : 'Candidate';
  const w=c.whySign;
  return `<article class="px card" tabindex="0" data-name="${esc(c.name)}" aria-label="${esc(c.name)}: press Enter for the full profile">
    <div class="ctop">${photo(c,'photo')}
      <div>
        <div class="rank"><span class="rk">#${c.order}</span><span class="rl ${c.match==='conditional'?'cond':''}">${esc(c.rankLabel||lbl)}</span></div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${esc(c.archetype)} · ${esc(c.location)}</div>
      </div>
    </div>
    ${chanPanel(c)}
    <p class="rankline">${esc(c.rankLine||'')}</p>
    <div class="pills"><span class="pill ok">✓ ${esc(c.mgmt.verdict)}</span>${growthChip(c.growth)}<span class="pill ${c.soldCompany?'ok':'warn'}">${esc(c.outcomeLabel||(c.soldCompany?'Sold a company':'No exit'))}</span></div>
    <dl class="px soft why">
      <div><dt>Cadence</dt><dd>${esc(w.cadence)}</dd></div>
      <div><dt>Voice</dt><dd>${esc(w.voice)}</dd></div>
      <div class="risk"><dt>Risk</dt><dd>${esc(w.risk)}</dd></div>
    </dl>
    <div class="bcats"><div class="gl">Brand categories that fit</div>
      <div class="chips">${(c.brandCategories||[]).map(t=>`<span class="chip cat">${esc(t)}</span>`).join('')}</div>
</div>
    <button type="button" class="openlink btn" data-open="${esc(c.name)}">Open full profile ›</button>
  </article>`;
}
function renderList(){
  const list=sorted();
  $('#grid').className = 'grid' + (list.length>4?' many':'');
  $('#grid').innerHTML = list.map(card).join('');
  document.querySelectorAll('.sorts .btn').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sort===sortKey));
}
$('#listSec').innerHTML = `
  <h2 class="title" id="listT">The shortlist</h2>
  <div class="toolbar">
    <div class="sorts" role="group" aria-label="Sort"><span class="label">Sort</span>
      <button class="btn" data-sort="rec">Recommended</button>
      <button class="btn" data-sort="aud">Audience size</button>
      <button class="btn" data-sort="growth">Growth</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>`;
document.querySelectorAll('.sorts .btn').forEach(b=>b.addEventListener('click',()=>{sortKey=b.dataset.sort; renderList();}));
renderList();

/* ---- caveats ---- */
$('#cavSec').innerHTML = `<h2 class="title" id="cavT">Caveats</h2><div class="px cav"><ul>${D.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;

/* ---- full longlist ---- */
const resCls = r => r==='On the board'?'board':r==='Skipped'?'skip':r==='Fail'?'fail':'other';
$('#longSec').innerHTML = `<p class="csvlink"><a href="${D.meta.longlistCsvData||esc(D.meta.longlistCsv)}" download="${esc(D.meta.longlistCsv||'longlist_all.csv')}">Download the longlist of everyone considered, as a CSV</a></p>`;
$('#foot').innerHTML = `${sprite('sparkle',12,{a:C.lav,b:C.pink})} Conjured with Creator Sourcer(er) by Antea Ordonez ${sprite('sparkle',12,{a:C.lav,b:C.pink})}`;

/* ---- pixel sparkle dividers between sections ---- */
['#spellSec','#listSec','#cavSec'].forEach(id=>{ const d=document.createElement('div'); d.className='divider'; d.setAttribute('aria-hidden','true');
  d.innerHTML=sprite('sparkle',14,{a:C.lav,b:C.pink})+sprite('heart',12,{a:C.pink,b:C.pink})+sprite('sparkle',18,{a:C.mint,b:C.lav})+sprite('heart',12,{a:C.pink,b:C.pink})+sprite('sparkle',14,{a:C.lav,b:C.pink}); $(id).before(d); });

/* ---- drawer ---- */
let cur=-1, lastFocus=null;
function openDrawer(name){
  const list=sorted(); cur=list.findIndex(c=>c.name===name); if(cur<0) return;
  const c=list[cur], sh=sharedOf(c), p=pickOf(c.name), w=c.whySign;
  lastFocus=document.activeElement;
  $('#dHead').innerHTML = `${photo(c,'photo')}<div><div class="rank"><span class="rk">#${c.order}</span><span class="rl ${c.match==='conditional'?'cond':''}">${esc(c.rankLabel||'Candidate')}</span></div><h3 id="dName">${esc(c.name)}</h3><div class="meta">${esc(c.archetype)} · ${esc(c.location)}</div><div class="dchans">${c.channels.map(ch=>`<a class="chan" href="${esc(ch.url)}" target="_blank" rel="noopener" title="Open ${esc(ch.label)} in a new tab">${esc(ch.label)}<span class="ext" aria-hidden="true">↗</span></a>`).join('')}</div></div>
    <div class="dnav"><button class="btn" id="dPrev" aria-label="Previous">‹</button><button class="btn" id="dNext" aria-label="Next">›</button><button class="btn" id="dClose" aria-label="Close">✕</button></div>`;
  const gold=(k,x)=>(ALEX[k]||[]).includes(x);   /* shared tags stay gold, never labelled */
  $('#dBody').innerHTML = `
    <div class="dsec"><h4>Biography</h4><p>${esc(c.bio)}</p></div>
    <div class="dsec"><h4>Track record</h4>
      <dl class="kv"><dt>Outcome</dt><dd>${esc(c.outcome)}</dd>${c.recognition?`<dt>Recognition</dt><dd>${esc(c.recognition)}</dd>`:''}</dl></div>
    <div class="dsec"><h4>Why they fit the spell</h4><p>${esc(c.fit)}</p></div>
    <div class="dsec"><h4>What they already make</h4><ul>${c.formats.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
    <div class="dsec tagsec">${tagGroups(c.tags,gold)}</div>
    <div class="dsec">${considerBox(c)}</div>
    ${c.pastWorkShow===false?'':`<div class="dsec"><h4>Past brand work</h4>${c.pastWork.length?`<ul>${c.pastWork.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:'<p>None yet.</p>'}${c.pastWorkNote?`<p style="font-size:14px;color:var(--muted)">${esc(c.pastWorkNote)}</p>`:''}</div>`}
    <div class="dsec bcats"><h4>Brand categories that fit</h4><div class="chips">${(c.brandCategories||[]).map(t=>`<span class="chip cat">${esc(t)}</span>`).join('')}</div>${c.brands.length?`<div class="ideas"><span class="ideas-l">${sprite('bulb',18,{a:C.ink,b:C.gold,c:'#ffffff',d:C.lav})} Ideas</span><div class="ideas-row">${c.brands.map(b=>`<span class="idea" title="${esc(b.why||'')}"><span class="spk" aria-hidden="true">✦</span>${esc(b.name)}</span>`).join('')}</div></div>`:''}</div>
`;
  $('#dBody').scrollTop=0;
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false'); $('#scrim').classList.add('open');
  $('#dClose').onclick=closeDrawer;
  $('#dPrev').onclick=()=>{const l=sorted(); openDrawer(l[(cur-1+l.length)%l.length].name)};
  $('#dNext').onclick=()=>{const l=sorted(); openDrawer(l[(cur+1)%l.length].name)};
  $('#dClose').focus();
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('open'); if(lastFocus) lastFocus.focus(); }
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#drawer').classList.contains('open')) closeDrawer(); });
/* channel links: plain native <a href target=_blank>. No JS opening; we only stop the click
   from bubbling to the card (which would open the profile drawer). Default navigation is untouched. */
document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('a.chan')) e.stopPropagation(); },true);
$('#grid').addEventListener('click',e=>{ if(e.target.closest('a')) return; const c=e.target.closest('.card'); if(c) openDrawer(c.dataset.name); });
$('#recSec').addEventListener('click',e=>{ const t=e.target.closest('.ptile'); if(t) openDrawer(t.dataset.name); });
$('#recSec').addEventListener('keydown',e=>{ const t=e.target.closest('.ptile'); if(t && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openDrawer(t.dataset.name);} });
$('#grid').addEventListener('keydown',e=>{ const c=e.target.closest('.card'); if(c && e.target===c && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openDrawer(c.dataset.name);} });
})();

/* highlight the tab for the section in view */
(function(){
  const links=[...document.querySelectorAll('#topnav a')];
  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  let forced=-1;
  links.forEach((a,i)=>a.addEventListener('click',()=>{forced=i;setTimeout(mark,0)}));
  ['wheel','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,()=>{forced=-1},{passive:true}));
  function mark(){
    const y=window.scrollY+120; let cur=-1;
    secs.forEach((s,i)=>{ if(s && s.offsetTop<=y) cur=i; });
    if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4) cur=secs.length-1;
    if(forced>=0) cur=forced;
    links.forEach((a,i)=>{ const on=i===cur; a.classList.toggle('on',on); if(on){a.setAttribute('aria-current','true')}else{a.removeAttribute('aria-current')} });
    const on=links[cur]; if(on){ const ul=on.parentNode.parentNode; const l=on.offsetLeft, r=l+on.offsetWidth; if(l<ul.scrollLeft||r>ul.scrollLeft+ul.clientWidth) ul.scrollLeft=l-20; }
  }
  window.addEventListener('scroll',mark,{passive:true}); window.addEventListener('resize',mark); mark();
})();
</script>
</body>
